<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CSMatrix-zC World | Server</title>

    <link
        rel="icon"
        type="image/x-icon"
        href="/LogoBot_csmatrixzc.ico"
    >

    <link
        rel="stylesheet"
        href="/css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="/css/server.css"
    >
</head>

<body>

<header class="site-header">
    <div class="container header-inner">

        <div class="brand-area">
            <div class="brand">
                CSMatrix-zC WORLD
            </div>

            <div class="subtitle">
                Game Server
            </div>
        </div>

        <div class="header-status">
            <span class="status-dot"></span>

            <span id="lastUpdate">
                Loading...
            </span>
        </div>

    </div>
</header>


<main class="container server-page">

    <a
        class="back-link"
        href="/"
    >
        ← Back to Game Servers
    </a>


    <section
        id="serverContent"
        class="server-detail"
    >

        <div class="loading">
            Loading server...
        </div>

    </section>

</main>


<footer class="site-footer">

    <div>
        CSMatrix-zC World
    </div>

    <div class="footer-version">
        Game Server Monitor
    </div>

</footer>


<script src="/js/server.js"></script>

</body>
</html>
